name: CI/CD Multi-Image Build

on:
  push:
    branches: [ "main" ] # Runs when you merge to main
  pull_request:
    branches: [ "main" ] # Runs when you propose a change

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Build & Push Trainer
      - name: Build Trainer
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/diabetes-trainer:latest -f ./Docker/trainer.Dockerfile .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/diabetes-trainer:latest

      # 2. Build & Push API
      - name: Build API
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/diabetes-api:latest -f ./Docker/api.Dockerfile .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/diabetes-api:latest

      # 3. Build & Push MLflow
      - name: Build MLflow
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/diabetes-mlflow:latest -f ./Docker/mlflow.Dockerfile .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/diabetes-mlflow:latest