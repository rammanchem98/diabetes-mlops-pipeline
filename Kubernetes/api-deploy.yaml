apiVersion: apps/v1
kind: Deployment
metadata:
  name: diabetes-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: diabetes-api
  template:
    metadata:
      labels:
        app: diabetes-api
    spec:
      containers:
        - name: api
          image: diabetes-ml-api:latest
          imagePullPolicy: Never
          command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-service:5000"
            - name: ARTIFACT_PATH
              value: "/mnt/shared/artifacts"
          volumeMounts:
            - name: shared-artifacts
              mountPath: /mnt/shared/artifacts
          # Professional Touch: Readiness probe ensures model is loaded before receiving traffic
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: shared-artifacts
          persistentVolumeClaim:
            claimName: artifacts-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: diabetes-api-service
spec:
  type: LoadBalancer # Or NodePort if testing locally
  selector:
    app: diabetes-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000