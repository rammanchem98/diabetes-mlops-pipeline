apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: mlflow-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-db
  template:
    metadata:
      labels:
        app: mlflow-db
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            # Injecting the Secrets we created
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mlflow-db-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-db-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: mlflow-db-secrets
                  key: POSTGRES_DB
          volumeMounts:
            # Mounting the PVC to the standard Postgres data directory
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: mlflow-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432